<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
        <title>AR Viewer</title>

        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

        <style>
            :root {
                --ink: #0b0d10;
                --panel: rgba(11, 13, 16, 0.82);
                --line: rgba(255, 255, 255, 0.14);
                --text: #f4f5f6;
                --text-dim: #a7adb4;
                --signal-idle: #5b6b7a;
                --signal-active: #f2a93c;
                --signal-active-dim: rgba(242, 169, 60, 0.35);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                width: 100%;
                height: 100%;
                background: var(--ink);
                font-family: "Inter", system-ui, sans-serif;
                color: var(--text);
            }

            /* ---------- Loading screen ---------- */

            #loading-screen {
                position: fixed;
                inset: 0;
                z-index: 50;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                background: var(--ink);
                transition: opacity 0.5s ease, visibility 0.5s ease;
            }

            #loading-screen.hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            .ring {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                border: 2px solid var(--line);
                border-top-color: var(--signal-active);
                animation: spin 0.9s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            #loading-screen p {
                font-family: "Space Grotesk", sans-serif;
                font-size: 15px;
                font-weight: 500;
                color: var(--text-dim);
                letter-spacing: 0.01em;
            }

            /* ---------- HUD chrome ---------- */

            #hud {
                position: fixed;
                inset: 0;
                z-index: 20;
                pointer-events: none;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
            }

            .top-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .status-pill {
                display: flex;
                align-items: center;
                gap: 8px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 100px;
                padding: 8px 14px 8px 10px;
                backdrop-filter: blur(10px);
            }

            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--signal-idle);
                transition: background 0.3s ease, box-shadow 0.3s ease;
            }

            .status-pill.found .status-dot {
                background: var(--signal-active);
                box-shadow: 0 0 0 4px var(--signal-active-dim);
            }

            .status-text {
                font-family: "Space Grotesk", sans-serif;
                font-size: 13px;
                font-weight: 500;
                color: var(--text-dim);
                transition: color 0.3s ease;
            }

            .status-pill.found .status-text {
                color: var(--text);
            }

            /* ---------- Viewfinder ---------- */

            .viewfinder {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 200px;
                height: 200px;
                transform: translate(-50%, -50%);
            }

            .corner {
                position: absolute;
                width: 28px;
                height: 28px;
                border: 2px solid var(--signal-idle);
                opacity: 0.85;
                transition: border-color 0.35s ease, opacity 0.35s ease, transform 0.35s ease;
            }

            .corner.tl {
                top: 0;
                left: 0;
                border-right: none;
                border-bottom: none;
            }
            .corner.tr {
                top: 0;
                right: 0;
                border-left: none;
                border-bottom: none;
            }
            .corner.bl {
                bottom: 0;
                left: 0;
                border-right: none;
                border-top: none;
            }
            .corner.br {
                bottom: 0;
                right: 0;
                border-left: none;
                border-top: none;
            }

            .viewfinder.searching .corner {
                animation: breathe 1.8s ease-in-out infinite;
            }

            .viewfinder.searching .corner.tr {
                animation-delay: 0.15s;
            }
            .viewfinder.searching .corner.bl {
                animation-delay: 0.3s;
            }
            .viewfinder.searching .corner.br {
                animation-delay: 0.45s;
            }

            @keyframes breathe {
                0%,
                100% {
                    opacity: 0.5;
                }
                50% {
                    opacity: 1;
                }
            }

            .viewfinder.found .corner {
                border-color: var(--signal-active);
                opacity: 1;
                transform: scale(1.08);
            }

            .viewfinder.found .corner.tl {
                transform: translate(-4px, -4px);
            }
            .viewfinder.found .corner.tr {
                transform: translate(4px, -4px);
            }
            .viewfinder.found .corner.bl {
                transform: translate(-4px, 4px);
            }
            .viewfinder.found .corner.br {
                transform: translate(4px, 4px);
            }

            /* ---------- Bottom instruction card ---------- */

            .instruction {
                pointer-events: none;
                align-self: center;
                width: 100%;
                max-width: 360px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 16px 18px;
                backdrop-filter: blur(10px);
                text-align: center;
                transition: border-color 0.3s ease;
            }

            .instruction.found {
                border-color: var(--signal-active-dim);
            }

            .instruction h1 {
                margin: 0 0 4px;
                font-family: "Space Grotesk", sans-serif;
                font-size: 16px;
                font-weight: 600;
                letter-spacing: 0.01em;
            }

            .instruction p {
                margin: 0;
                font-size: 13px;
                line-height: 1.45;
                color: var(--text-dim);
            }

            @media (prefers-reduced-motion: reduce) {
                .viewfinder.searching .corner,
                .ring {
                    animation: none;
                }
            }
        </style>
    </head>

    <body>
        <div id="loading-screen">
            <div class="ring"></div>
            <p>Loading experience</p>
        </div>

        <div id="hud">
            <div class="top-bar">
                <div class="status-pill" id="status-pill">
                    <div class="status-dot"></div>
                    <div class="status-text" id="status-text">Searching</div>
                </div>
            </div>

            <div class="viewfinder searching" id="viewfinder">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>

            <div class="instruction" id="instruction">
                <h1 id="instruction-title">Point your camera at the marker</h1>
                <p id="instruction-body">Keep the marker flat, well lit, and fully in frame.</p>
            </div>
        </div>

        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item id="animated-asset" src="assets/asset.gltf"></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-entity
                    id="bowser-model"
                    scale="1.710778670758883 1.710778670758883 1.710778670758883"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <script>
            const scene = document.getElementById("scene");
            const loadingScreen = document.getElementById("loading-screen");
            const statusPill = document.getElementById("status-pill");
            const statusText = document.getElementById("status-text");
            const viewfinder = document.getElementById("viewfinder");
            const instruction = document.getElementById("instruction");
            const instructionTitle = document.getElementById("instruction-title");
            const instructionBody = document.getElementById("instruction-body");

            function setFoundState(found) {
                statusPill.classList.toggle("found", found);
                viewfinder.classList.toggle("found", found);
                viewfinder.classList.toggle("searching", !found);
                instruction.classList.toggle("found", found);
                statusText.textContent = found ? "Marker locked" : "Searching";
                instructionTitle.textContent = found ? "Marker found" : "Point your camera at the marker";
                instructionBody.textContent = found
                    ? "Move around to view it from different angles."
                    : "Keep the marker flat, well lit, and fully in frame.";
            }

            scene.addEventListener("loaded", () => {
                loadingScreen.classList.add("hidden");
            });

            const marker = document.getElementById("animated-marker");
            marker.addEventListener("markerFound", () => setFoundState(true));
            marker.addEventListener("markerLost", () => setFoundState(false));

            // Fallback: hide the loading screen even if the scene event
            // is slow to fire on some devices/browsers.
            setTimeout(() => loadingScreen.classList.add("hidden"), 6000);
        </script>
    </body>
</html>
